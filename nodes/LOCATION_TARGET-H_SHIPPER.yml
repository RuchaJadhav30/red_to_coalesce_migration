  description: "Migrated from WhereScape RED hub h_shipper (object key 90; source mappings 14 src_h_shipper_a23e7625 / update_src_h_shipper_a23e7625 from stage_shipper_traders_north, and 15 src_h_shipper_1_c798c97 / update_src_h_shipper__c798c97 from stage_shipper_traders_south). Each source inserts SELECT DISTINCT rows WHERE NOT EXISTS a hub row with the same SHIPPER_NAME, as in RED. Known behaviors: North runs first, so a non-NULL shipper name present in both sources keeps North's DSS_RECORD_SOURCE and DSS_LOAD_DATE; NULL SHIPPER_NAME values are not excluded by the equality-based NOT EXISTS and can be inserted on every run; primaryKey/uniqueKey are metadata only and are not enforced by Snowflake; DSS_CREATE_TIME uses CURRENT_TIMESTAMP() rather than RED's single per-procedure timestamp. Converted in place to the Data Vault by Scalefree Hub node type (package @coalesce/snowflake/data-vault-by-scalefree 3.0.0, data-vault-by-scalefree:::6); differences from the RED procedures and the previous Coalesce Hub: (1) the existence check is NOT EXISTS on the hash key HK_H_SHIPPER instead of the business key SHIPPER_NAME, which is equivalent while HK_H_SHIPPER is the Stage's deterministic MD5 of SHIPPER_NAME; (2) a NULL SHIPPER_NAME hashes to MD5('null'), so it is inserted once instead of on every run, and it shares a hash key with a text business key equal to 'null'; (3) each source batch is reduced to one row per hash key by QUALIFY ROW_NUMBER() OVER (PARTITION BY HK_H_SHIPPER ORDER BY DSS_LOAD_DATE) = 1 (ties are arbitrary), so the same key with a different DSS_RECORD_SOURCE or DSS_LOAD_DATE is no longer inserted twice; (4) high-water-mark filtering is disabled (disable_hwm: true) because RED applies none; (5) sources still load North then South, and primary/unique keys remain unenforced by Snowflake."
