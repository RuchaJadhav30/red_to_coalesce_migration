  description: "Migrated from WhereScape RED hub h_supplier (object key 91; source mappings 16 src_h_supplier_ce72b9c1 / rawvault.update_src_h_supplie_ce72b9c1 (179) from stage_supplier_traders_north, and 17 src_h_supplier_1_fcab5933 / rawvault.update_src_h_supplie_fcab5933 (180) from stage_supplier_traders_south). Each source inserts SELECT DISTINCT rows WHERE NOT EXISTS a hub row with the same SUPPLIER_NAME, as in RED. Known behaviors: a NULL SUPPLIER_NAME passes the equality-based NOT EXISTS and can be inserted on every run; primaryKey/uniqueKey are metadata only and not enforced by Snowflake, so overlapping runs may insert duplicates; North runs first in this Coalesce design, so a non-NULL supplier name present in both sources keeps North's DSS_RECORD_SOURCE and DSS_LOAD_DATE (RED's original scheduler run order is unknown); DSS_CREATE_TIME uses CURRENT_TIMESTAMP() rather than RED's one GETDATE() per procedure; case and trailing-space differences in supplier names are compared exactly in Snowflake and may behave differently from SQL Server collation. Converted in place to the Data Vault by Scalefree Hub node type (package @coalesce/snowflake/data-vault-by-scalefree 3.0.0, data-vault-by-scalefree:::6); differences from the RED procedures and the previous Coalesce Hub: (1) the existence check is NOT EXISTS on the hash key HK_H_SUPPLIER instead of the business key SUPPLIER_NAME, which is equivalent while HK_H_SUPPLIER is the Stage's deterministic MD5 of SUPPLIER_NAME; (2) a NULL SUPPLIER_NAME hashes to MD5('null'), so it is inserted once instead of on every run, and it shares a hash key with a text business key equal to 'null'; (3) each source batch is reduced to one row per hash key by QUALIFY ROW_NUMBER() OVER (PARTITION BY HK_H_SUPPLIER ORDER BY DSS_LOAD_DATE) = 1 (ties are arbitrary), so the same key with a different DSS_RECORD_SOURCE or DSS_LOAD_DATE is no longer inserted twice; (4) high-water-mark filtering is disabled (disable_hwm: true) because RED applies none; (5) sources still load North then South, and primary/unique keys remain unenforced by Snowflake."
