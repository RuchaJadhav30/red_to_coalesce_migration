  description: "Migrated from WhereScape RED hub h_territory (object key 92; source mappings 18 src_h_territory_85b8fc85 / rawvault.update_src_h_territo_85b8fc85 (181) from stage_territory_traders_north, and 19 src_h_territory_1_fb6bfaf7 / rawvault.update_src_h_territo_fb6bfaf7 (182) from stage_territory_traders_south). Each source inserts SELECT DISTINCT rows WHERE NOT EXISTS a hub row with the same TERRITORY_ID, as in RED. Known behaviors: TERRITORY_ID must remain text to preserve leading zeros; a NULL TERRITORY_ID passes the equality-based NOT EXISTS and can be inserted on every run; primaryKey/uniqueKey are metadata only and not enforced by Snowflake, so overlapping runs may insert duplicates; North runs first in this Coalesce design, so a non-NULL territory ID present in both sources keeps North's DSS_RECORD_SOURCE and DSS_LOAD_DATE (RED's original scheduler run order is unknown); DSS_CREATE_TIME uses CURRENT_TIMESTAMP() rather than RED's one GETDATE() per procedure; keys are compared exactly in Snowflake, which may differ from SQL Server collation behavior. TERRITORYDESCRIPTION (RED nchar(50), Stage VARCHAR(50)) and REGIONID are not hub columns; the nchar/VARCHAR difference affects only the Stage LROC change hash. Converted in place to the Data Vault by Scalefree Hub node type (package @coalesce/snowflake/data-vault-by-scalefree 3.0.0, data-vault-by-scalefree:::6); differences from the RED procedures and the previous Coalesce Hub: (1) the existence check is NOT EXISTS on the hash key HK_H_TERRITORY instead of the business key TERRITORY_ID, which is equivalent while HK_H_TERRITORY is the Stage's deterministic MD5 of TERRITORY_ID; (2) a NULL TERRITORY_ID hashes to MD5('null'), so it is inserted once instead of on every run, and it shares a hash key with a text business key equal to 'null'; (3) each source batch is reduced to one row per hash key by QUALIFY ROW_NUMBER() OVER (PARTITION BY HK_H_TERRITORY ORDER BY DSS_LOAD_DATE) = 1 (ties are arbitrary), so the same key with a different DSS_RECORD_SOURCE or DSS_LOAD_DATE is no longer inserted twice; (4) high-water-mark filtering is disabled (disable_hwm: true) because RED applies none; (5) sources still load North then South, and primary/unique keys remain unenforced by Snowflake."
