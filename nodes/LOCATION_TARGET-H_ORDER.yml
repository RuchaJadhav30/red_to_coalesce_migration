  description: "Migrated from WhereScape RED hub h_order (source mappings src_h_order_f0fc7205 / update_src_h_order_f0fc7205 from stage_order_traders_north, and src_h_order_1_a3a81077 / update_src_h_order_1_a3a81077 from stage_order_traders_south). Converted in place to the Data Vault by Scalefree Hub node type (package @coalesce/snowflake/data-vault-by-scalefree 3.0.0, data-vault-by-scalefree:::6); differences from the RED procedures and the previous Coalesce Hub: (1) the existence check is NOT EXISTS on the hash key HK_H_ORDER instead of the business key ORDER_NUMBER, which is equivalent while HK_H_ORDER is the Stage's deterministic MD5 of ORDER_NUMBER; (2) a NULL ORDER_NUMBER hashes to MD5('null'), so it is inserted once instead of on every run, and it shares a hash key with a text business key equal to 'null'; (3) each source batch is reduced to one row per hash key by QUALIFY ROW_NUMBER() OVER (PARTITION BY HK_H_ORDER ORDER BY DSS_LOAD_DATE) = 1 (ties are arbitrary), so the same key with a different DSS_RECORD_SOURCE or DSS_LOAD_DATE is no longer inserted twice; (4) high-water-mark filtering is disabled (disable_hwm: true) because RED applies none; (5) sources still load North then South, and primary/unique keys remain unenforced by Snowflake."
