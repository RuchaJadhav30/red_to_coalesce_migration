  description: "Migrated from WhereScape RED satellite s_order_details_transact_traders_north (object key 105; update procedure update_s_order_detai_aae6e250, key 195, template wsl_sqlserver_proc_dv_perm 8.5.1.0) using the Data Vault by Scalefree Satellite v0 node type (data-vault-by-scalefree:::8, package 3.0.0) with the project V0B extension in the source join. Parent link L_ORDER_DETAILS via HK_L_ORDER_DETAILS (RED key 132, not yet migrated; the hash key value comes from the Stage and the load does not join the Link, H_ORDER or H_PRODUCT, exactly as in RED); source Stage STAGE_ORDER_DETAILS_TRADERS_NORTH. Key grain: the Link key covers order and product only (ORDERLINENUMBER is not part of it), so several order lines for the same order and product in one load share a hash key; RED would then fail on its unique index. Logic: the package inserts rows whose change hash differs from the latest Satellite row by DSS_LOAD_DATE, after collapsing identical consecutive change hashes per HK_L_ORDER_DETAILS (LAG ordered by DSS_LOAD_DATE); the V0B source join adds RED's LEFT OUTER JOIN to current rows (MAX(DSS_START_DATE) and MAX(DSS_VERSION) per HK_L_ORDER_DETAILS) and RED's NOT EXISTS on hash key, change hash and current start date; DSS_VERSION = COALESCE(MAX(DSS_VERSION), 0) + 1; high-water mark disabled; no UPDATE, MERGE, DELETE or TRUNCATE. Differences from RED: (1) a row is inserted only if both the package check (latest row by DSS_LOAD_DATE) and RED's check (latest row by DSS_START_DATE) pass, so back-dated deliveries or reloads with the same DSS_LOAD_DATE can be skipped where RED would insert, and ties on DSS_LOAD_DATE are resolved arbitrarily; (2) identical consecutive change hashes for one key within a load are collapsed to one row, where RED would insert both and fail on its unique index; (3) primary and unique key metadata is not enforced (RED unique indexes s_order_detai_aae6e250_idx_PK and s_order_detai_aae6e250_idx_CK), so duplicate rows for the same hash key and start date may be inserted where RED would fail and roll back; (4) DSS_START_DATE and DSS_CREATE_TIME use CURRENT_TIMESTAMP(), whose precision and time-zone conversion may differ from SQL Server datetime; (5) the Stage hash key and change hash are POC MD5 values and do not establish RED hash parity. Run coa create only once, on an empty target, before the first load."
