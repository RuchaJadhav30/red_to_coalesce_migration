  description: "Migrated from WhereScape RED link l_products_categories_suppliers (object key 134; source mappings src_l_products_categories_suppliers_bcf77d25 / update_src_l_product_bcf77d25 from stage_products_categories_suppliers_traders_north, and src_l_products_categories_suppliers_1_5d0cd397 / update_src_l_product_5d0cd397 from stage_products_categories_suppliers_traders_south) using the Data Vault by Scalefree Link node type (data-vault-by-scalefree:::7, package 3.0.0). Parent hubs: H_CATEGORY, H_PRODUCT, H_SUPPLIER. Both RED procedures insert SELECT DISTINCT from their Stage with NOT EXISTS on the combination of hub hash keys (hk_h_category, hk_h_product, hk_h_supplier). Differences from RED: (1) the package checks existence on the link hash key HK_L_PRODUCTS_CATEGORIES_SUPPLIERS instead of the hub-key combination, which is equivalent while HK_L_PRODUCTS_CATEGORIES_SUPPLIERS is the Stage's deterministic MD5 of those hub keys in this order; (2) each source batch is reduced to one row per HK_L_PRODUCTS_CATEGORIES_SUPPLIERS by QUALIFY ROW_NUMBER() OVER (PARTITION BY HK_L_PRODUCTS_CATEGORIES_SUPPLIERS ORDER BY DSS_LOAD_DATE) = 1 (ties are arbitrary), so rows with the same hub-key combination but a different DSS_RECORD_SOURCE or DSS_LOAD_DATE are inserted once, where RED's DISTINCT would insert both and fail on unique index l_products_ca_a5a8892c_idx_PK; (3) high-water-mark filtering is disabled (disable_hwm: true) because RED applies none; (4) sources load North then South (RED does not define an order); (5) DSS_CREATE_TIME uses CURRENT_TIMESTAMP(); (6) primary and unique keys are not enforced by Snowflake, and the hash keys are POC MD5 values with no RED hash parity."
